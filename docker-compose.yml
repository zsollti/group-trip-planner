# Local development database. Not used in production (Railway provides managed
# Postgres). Start with: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: gtp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gtp
      POSTGRES_PASSWORD: gtp_dev_password
      POSTGRES_DB: gtp_dev
    ports:
      - "5432:5432"
    volumes:
      - gtp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtp -d gtp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gtp-pgdata:
