name: Deploy

# Production-only, no staging (Phase-7 decision 2): the full gate runs on every
# pull request, and merging to main is the deploy.
#
# The trigger is deliberately `workflow_run` rather than `push`. A push-triggered
# deploy would race the CI job and ship code that had not passed it; this only
# starts once the CI workflow has *finished on main*, and the guard below drops
# the run unless it finished green. Railway's own GitHub auto-deploy is left
# switched off for the same reason — see DEPLOY.md — so this workflow is the
# single path from merge to production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Also available by hand, for redeploying after a variable change (which
  # needs a rebuild for the web app: Vite inlines VITE_* at build time).
  workflow_dispatch:

# Never let two deploys of the same service overlap. Not cancel-in-progress: a
# half-applied migration is worse than a queued deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    # `workflow_run` fires on failure too, so the conclusion has to be checked
    # explicitly. On workflow_dispatch there is no upstream run to inspect.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production

    steps:
      # workflow_run checks out the default branch by default, which is what we
      # want, but pin it to the exact commit CI validated so a merge landing
      # mid-run cannot slip an unverified commit into the deploy.
      - name: Checkout the commit CI passed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Absent on a fork, or before the owner has minted a project token. Fail
      # loudly rather than reporting a green deploy that never happened.
      - name: Require the Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Add a Railway project token" \
                 "as a repository secret (see DEPLOY.md §CI/CD)."
            exit 1
          fi

      # Pinned. An unpinned `npm install -g` in the deploy path means a bad CLI
      # release can break production deploys with no change of ours — the one
      # dependency where "latest" is least welcome. Bump deliberately.
      - name: Install the Railway CLI
        run: npm install -g @railway/cli@5.35.1

      # Stamp the build with the commit being deployed, so the deploy can be
      # verified by *outcome* rather than by the CLI's word for it. Vite copies
      # `public/` into the bundle and Caddy serves it, so the live site ends up
      # publishing the SHA it was built from at `/build.txt`.
      #
      # This exists because there was no automated check that the frontend had
      # deployed at all. Twice on 2026-08-10 the only way to answer "did it
      # ship" was to fetch the production CSS bundle and grep it by hand.
      - name: Stamp the build with the commit SHA
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p apps/web-board/public
          printf '%s' "$SHA" > apps/web-board/public/build.txt

      # The API first: its container runs `prisma migrate deploy` at start, so
      # the schema the new frontend expects is in place before that frontend is
      # served. Migrations in this project are additive (every one to date adds
      # a column, table or index), so the brief window where the old API meets
      # the new schema is safe.
      - name: Deploy the API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bash .github/scripts/railway-up.sh api

      # Moved ahead of the web deploy, where it now earns its keep as a gate
      # rather than a postscript: if the API is not answering, a newer frontend
      # must not be served against it. A deploy that boots but cannot reach
      # Postgres is the failure worth catching automatically; /health returns
      # 503 for exactly that case.
      - name: Verify the deployed API is healthy
        env:
          API_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::Repository variable API_PUBLIC_URL is unset;" \
                 "skipping the post-deploy health check."
            exit 0
          fi
          for attempt in $(seq 1 20); do
            code=$(curl -fsS -o /tmp/health.json -w '%{http_code}' "$API_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s): $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code:-no response}"
            sleep 15
          done
          echo "::error::$API_URL/health did not return 200 within five minutes."
          exit 1

      - name: Deploy the Trip Board
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bash .github/scripts/railway-up.sh web-board

      # The check the pipeline was missing: proof that the *frontend* being
      # served is the commit this run deployed. The API has its health poll
      # above; until now the web app had nothing at all, so a silently skipped
      # web deploy looked identical to a successful one.
      #
      # The SPA history fallback answers `/build.txt` with index.html when the
      # file is absent, so this compares the body exactly rather than trusting
      # a 200.
      - name: Verify the Trip Board is serving this commit
        env:
          WEB_URL: ${{ vars.WEB_PUBLIC_URL }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$WEB_URL" ]; then
            echo "::warning::Repository variable WEB_PUBLIC_URL is unset;" \
                 "skipping the frontend deploy verification (see DEPLOY.md §8)."
            exit 0
          fi
          for attempt in $(seq 1 30); do
            served=$(curl -fsS -H 'Cache-Control: no-cache' "$WEB_URL/build.txt" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$served" = "$SHA" ]; then
              echo "Trip Board is serving ${SHA} after ${attempt} attempt(s)."
              exit 0
            fi
            echo "attempt ${attempt}: serving ${served:0:12}… (want ${SHA:0:12}…)"
            sleep 15
          done
          echo "::error::$WEB_URL/build.txt did not report ${SHA} within seven minutes."
          exit 1
