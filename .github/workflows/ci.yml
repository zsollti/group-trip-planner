name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Keep this name stable — it is the required status-check context that
    # branch protection targets once the repo goes public.
    name: install · lint · typecheck · test
    runs-on: ubuntu-latest
    # A ceiling, because a hung step is not a slow step. This job takes about
    # three minutes; a run that reaches thirty has stopped making progress, and
    # without this it would sit there for GitHub's six-hour default holding an
    # auto-merge open the whole time. One did.
    timeout-minutes: 30

    # Real Postgres for the auth integration tests (real DB, per Phase 0.6 DoD).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gtp
          POSTGRES_PASSWORD: gtp_dev_password
          POSTGRES_DB: gtp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtp -d gtp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gtp:gtp_dev_password@localhost:5432/gtp_test?schema=public
      # Test-only signing secret; production uses a real secret from env.
      JWT_SECRET: ci-only-secret-0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm is pinned via the root package.json "packageManager" field, so
      # action-setup installs the exact same version used locally.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm --filter @gtp/api db:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # The browser itself, cached across runs.
      #
      # Keyed on the resolved Playwright version rather than on the lockfile
      # hash: the download only changes when that version does, and a lockfile
      # key would miss on every unrelated dependency bump. `restore-keys` gives
      # a partial hit something to fall back to on a version bump, which is
      # still faster than a cold download.
      - name: Resolve the Playwright version
        id: pw
        run: |
          version=$(pnpm --filter @gtp/e2e exec playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-

      # Just the browser. **No `--with-deps`**, and that is the fix rather than a
      # shortcut.
      #
      # `--with-deps` is what hung: a run sat on it for over an hour, and the log
      # says exactly why. Every shared library Chromium needs was already
      # "the newest version" — the runner image ships them — so the only packages
      # apt had to fetch were 21 MB of CJK, Cyrillic and emoji **fonts**, coming
      # down from a degraded Ubuntu mirror at about 60 KB/s. Playwright installs
      # those so screenshots of non-Latin text render; this repo takes no
      # screenshots by rule, and every journey is Latin.
      #
      # So the step is gone, along with three minutes and the whole failure mode.
      # If a future runner image does drop a library, Chromium fails to launch and
      # says so loudly in the next step — which is a better signal than a silent
      # 21 MB download on every run.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: pnpm --filter @gtp/e2e exec playwright install chromium

      # The browser journeys (Phase 7.4). They start their own API and static
      # web server against the Postgres service above, so nothing else in this
      # job needs to be running.
      - name: End-to-end tests
        run: pnpm --filter @gtp/e2e run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
