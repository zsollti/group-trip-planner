name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: install · lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Placeholder gate for Phase -1. The monorepo (pnpm + Turborepo) lands in
      # Phase 0.1; this job is fleshed out into install → lint → typecheck → test
      # in Phase 0.2. It exists now so the required PR check is present from the
      # very first pull request.
      - name: Bootstrap check
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            echo "Monorepo present — CI should be wired up (Phase 0.2)."
          else
            echo "Phase -1 bootstrap: no workspace yet. Gate passes as a placeholder."
          fi
